<!-- Captured once and stamped per mode: ng-content cannot re-project across
     @switch branch changes (same pattern as rpt-app-shell's main content). -->
<ng-template #body><ng-content /></ng-template>
<ng-template #aside><ng-content select="[rptContentAside]" /></ng-template>

@switch (mode()) {
  @case ('split') {
    <div class="rpt-content-layout rpt-content-layout--split">
      <div class="rpt-content-layout__primary">
        <ng-container [ngTemplateOutlet]="body" />
      </div>
      <div class="rpt-content-layout__aside">
        <ng-container [ngTemplateOutlet]="aside" />
      </div>
    </div>
  }
  @case ('centered') {
    <div class="rpt-content-layout rpt-content-layout--centered">
      <ng-container [ngTemplateOutlet]="body" />
    </div>
  }
  @default {
    <div class="rpt-content-layout rpt-content-layout--full">
      <ng-container [ngTemplateOutlet]="body" />
    </div>
  }
}
