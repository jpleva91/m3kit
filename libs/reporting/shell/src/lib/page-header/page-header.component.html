<header class="rpt-page-header">
  <div class="rpt-page-header__text">
    <h1 class="rpt-page-header__title">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="rpt-page-header__subtitle">{{ subtitle() }}</p>
    }
  </div>
  <div class="rpt-page-header__actions">
    <ng-content select="[rptPageHeaderActions]" />
  </div>
</header>
