<svg
  class="rpt-donut-chart"
  [attr.viewBox]="viewBox"
  [style.height.px]="height()"
  role="img"
  [attr.aria-label]="ariaLabel()"
>
  <!-- Rotated -90° so slices start at 12 o'clock and run clockwise. -->
  <g [attr.transform]="'rotate(-90 ' + center + ' ' + center + ')'">
    @for (slice of sliceViews(); track $index) {
      <circle
        class="rpt-donut-chart__slice"
        [attr.cx]="center"
        [attr.cy]="center"
        [attr.r]="radius"
        fill="none"
        pathLength="100"
        [attr.stroke]="slice.color"
        [attr.stroke-width]="ringWidth"
        [attr.stroke-dasharray]="slice.dashArray"
        [attr.stroke-dashoffset]="slice.dashOffset"
        [attr.data-slice]="slice.label"
      />
    }
  </g>

  @if (centerValue(); as value) {
    <text
      class="rpt-donut-chart__center-value"
      [attr.x]="center"
      [attr.y]="centerValueY()"
      text-anchor="middle"
    >
      {{ value }}
    </text>
  }
  @if (centerLabel(); as label) {
    <text
      class="rpt-donut-chart__center-label"
      [attr.x]="center"
      [attr.y]="center + 20"
      text-anchor="middle"
    >
      {{ label }}
    </text>
  }
</svg>
