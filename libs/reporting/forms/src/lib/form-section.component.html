<section class="rpt-form-section">
  <header class="rpt-form-section__header">
    <div class="rpt-form-section__title" role="heading" [attr.aria-level]="headingLevel()">
      {{ title() }}
    </div>
    @if (description()) {
      <p class="rpt-form-section__description">{{ description() }}</p>
    }
  </header>
  <div class="rpt-form-section__content">
    <ng-content />
  </div>
</section>
