<div class="rpt-filter-form">
  <div class="rpt-filter-form__fields">
    @for (column of fields(); track column.key) {
      <rpt-form-field
        [label]="column.header"
        [control]="controlFor(column.key)"
        [type]="fieldTypeFor(column)"
        [options]="optionsFor(column.key)"
      />
    }
  </div>
  <div class="rpt-filter-form__actions">
    <button mat-stroked-button type="button" (click)="reset()">Reset</button>
  </div>
</div>
