<mat-card appearance="outlined" class="m3k-chart-card">
  <mat-card-header class="m3k-chart-card__header">
    <h2 mat-card-title class="m3k-chart-card__title">{{ title() }}</h2>
    @if (subtitle(); as sub) {
      <div mat-card-subtitle class="m3k-chart-card__subtitle">{{ sub }}</div>
    }
  </mat-card-header>

  <mat-card-content class="m3k-chart-card__content">
    @if (loading()) {
      <mat-progress-bar
        class="m3k-chart-card__progress"
        mode="indeterminate"
        aria-label="Loading chart data"
      />
    } @else if (empty()) {
      <p class="m3k-chart-card__empty">{{ emptyMessage() }}</p>
    } @else {
      <ng-content />
      <div class="m3k-chart-card__legend">
        <ng-content select="[m3kChartCardLegend]" />
      </div>
    }
  </mat-card-content>
</mat-card>
