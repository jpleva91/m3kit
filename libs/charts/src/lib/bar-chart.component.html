<svg
  class="m3k-bar-chart"
  [attr.viewBox]="viewBox()"
  preserveAspectRatio="none"
  [style.height.px]="height()"
  role="img"
  [attr.aria-label]="ariaLabel()"
>
  <title>{{ ariaLabel() }}</title>
  <desc>{{ accessibleDescription() }}</desc>
  @if (view(); as v) {
    @for (tick of v.valueTicks; track tick.pos) {
      @if (horizontal()) {
        <line
          class="m3k-bar-chart__grid-line"
          [attr.x1]="tick.pos"
          [attr.x2]="tick.pos"
          [attr.y1]="v.top"
          [attr.y2]="v.bottom"
        />
        <text
          class="m3k-bar-chart__tick m3k-bar-chart__tick--value"
          [attr.x]="tick.pos"
          [attr.y]="v.bottom + 16"
          text-anchor="middle"
        >
          {{ tick.label }}
        </text>
      } @else {
        <line
          class="m3k-bar-chart__grid-line"
          [attr.x1]="v.left"
          [attr.x2]="v.right"
          [attr.y1]="tick.pos"
          [attr.y2]="tick.pos"
        />
        <text
          class="m3k-bar-chart__tick m3k-bar-chart__tick--value"
          [attr.x]="v.left - 6"
          [attr.y]="tick.pos"
          text-anchor="end"
          dominant-baseline="middle"
        >
          {{ tick.label }}
        </text>
      }
    }

    @for (tick of v.categoryTicks; track $index) {
      @if (horizontal()) {
        <text
          class="m3k-bar-chart__tick m3k-bar-chart__tick--category"
          [attr.x]="v.left - 6"
          [attr.y]="tick.pos"
          text-anchor="end"
          dominant-baseline="middle"
        >
          {{ tick.label }}
        </text>
      } @else {
        <text
          class="m3k-bar-chart__tick m3k-bar-chart__tick--category"
          [attr.x]="tick.pos"
          [attr.y]="v.bottom + 16"
          text-anchor="middle"
        >
          {{ tick.label }}
        </text>
      }
    }

    @for (bar of v.bars; track bar.categoryIndex + '-' + bar.seriesIndex) {
      <rect
        class="m3k-bar-chart__bar"
        [attr.x]="bar.x"
        [attr.y]="bar.y"
        [attr.width]="bar.width"
        [attr.height]="bar.height"
        [attr.fill]="bar.color"
        [attr.data-category]="bar.categoryIndex"
        [attr.data-series]="bar.seriesIndex"
      />
    }
  }
</svg>
