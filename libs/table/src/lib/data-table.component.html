<div class="m3k-data-table">
  <div class="m3k-data-table__progress">
    @if (isLoading()) {
      <mat-progress-bar mode="indeterminate" aria-label="Loading report data" />
    }
  </div>

  <div class="m3k-data-table__scroll">
  <table
    mat-table
    matSort
    [dataSource]="displayedRows()"
    [matSortActive]="sortActive()"
    [matSortDirection]="sortDirection()"
    (matSortChange)="onSortChange($event)"
  >
    @for (column of columns(); track column.key) {
      <ng-container [matColumnDef]="column.key">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          [disabled]="!column.sortable"
          [style.width]="column.width ?? null"
          [class]="'m3k-align-' + (column.align ?? 'start')"
        >
          {{ column.header }}
        </th>
        <td
          mat-cell
          *matCellDef="let row"
          [class]="'m3k-align-' + (column.align ?? 'start') + ' m3k-type-' + column.type"
        >
          @if (column.type === 'badge') {
            <span class="m3k-badge" [attr.data-color]="badgeColor(row, column)">
              {{ formatCell(row, column) }}
            </span>
          } @else {
            {{ formatCell(row, column) }}
          }
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr
      mat-row
      class="m3k-data-table__row"
      *matRowDef="let row; columns: displayedColumns()"
      tabindex="0"
      (click)="rowClicked.emit(row)"
      (keydown.enter)="rowClicked.emit(row)"
      (keydown.space)="$event.preventDefault(); rowClicked.emit(row)"
    ></tr>

    <tr class="m3k-data-table__empty-row" *matNoDataRow>
      @if (hasError()) {
        <td
          class="m3k-data-table__error-cell"
          [attr.colspan]="displayedColumns().length"
        >
          {{ errorText() }}
        </td>
      } @else {
        <td
          class="m3k-data-table__empty-cell"
          [attr.colspan]="displayedColumns().length"
        >
          No matching records.
        </td>
      }
    </tr>
  </table>
  </div>

  <mat-paginator
    [length]="totalRows()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions"
    [showFirstLastButtons]="true"
    (page)="onPage($event)"
    aria-label="Select report page"
  />
</div>
