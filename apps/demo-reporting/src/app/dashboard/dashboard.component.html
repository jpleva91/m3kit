<!--
  Composition varies with the active shell preset (core/layout-presets.ts).
  The lib components stay brand-agnostic; the page only re-arranges them.
  Chart-card titles render as h2, keeping heading order under the page h1.
-->
@switch (layoutPreset()) {
  <!-- Terminal: hairline KPI strip, tight three-up chart row, compact details. -->
  @case ('command-bar') {
    <section class="dashboard dashboard--command-bar">
      <m3k-page-header class="dashboard__header" title="Dashboard" />

      <m3k-kpi-strip class="dashboard__strip" [items]="kpiStripItems" />

      <div class="dashboard__chart-strip">
        <m3k-chart-card title="Revenue" subtitle="Paid, trailing 12 months">
          <m3k-line-chart
            [series]="revenueSeries"
            [height]="180"
            ariaLabel="Paid revenue by month, trailing twelve months"
          />
        </m3k-chart-card>
        <m3k-chart-card title="Monthly volume" subtitle="Invoices by status">
          <m3k-bar-chart
            [categories]="monthlyStatus.categories"
            [series]="monthlyStatus.series"
            mode="stacked"
            [height]="180"
            ariaLabel="Monthly invoice counts stacked by status"
          />
        </m3k-chart-card>
        <m3k-chart-card title="Status mix" subtitle="All invoices">
          <m3k-donut-chart
            [slices]="statusSlices"
            centerLabel="Invoices"
            [centerValue]="invoiceCount"
            [height]="180"
            ariaLabel="Invoice count by status"
          />
          <m3k-chart-legend m3kChartCardLegend [items]="statusLegend" />
        </m3k-chart-card>
      </div>

      <div class="dashboard__detail-row">
        <m3k-detail-card
          title="Latest invoice"
          [subtitle]="latestInvoice.number"
          [rows]="latestInvoiceRows"
        />
        <m3k-detail-card title="Top customer" subtitle="By total billed" [rows]="topCustomerRows" />
      </div>
    </section>
  }

  <!-- Ledger: typeset figure rail; charts stack single-column in the broadsheet. -->
  @case ('contents-rail') {
    <section class="dashboard dashboard--contents-rail">
      <m3k-page-header class="dashboard__header" title="Dashboard" />

      <div class="dashboard__columns">
        <section class="dashboard__figures" aria-label="Principal figures">
          <h2 class="dashboard__figures-heading">Principal figures</h2>

          @for (figure of figures; track figure.label) {
            <div class="dashboard__figure">
              <span class="dashboard__figure-label">{{ figure.label }}</span>
              <div class="dashboard__figure-row">
                <span
                  class="dashboard__figure-value"
                  [class.dashboard__figure-value--lede]="figure.lede"
                  [class.dashboard__figure-value--negative]="figure.negative"
                  >{{ figure.value }}</span
                >
                <span
                  class="dashboard__figure-delta"
                  [class.dashboard__figure-delta--up]="figure.delta > 0"
                  [class.dashboard__figure-delta--down]="figure.delta < 0"
                  >{{ figure.formattedDelta }}</span
                >
              </div>
              <p class="dashboard__figure-note">{{ figure.note }}</p>
            </div>
          }
        </section>

        <div class="dashboard__broadsheet">
          <m3k-chart-card title="Receipts across the year" subtitle="Paid invoices, by month">
            <m3k-line-chart
              [series]="revenueSeries"
              [area]="true"
              ariaLabel="Paid revenue by month, trailing twelve months"
            />
          </m3k-chart-card>
          <m3k-chart-card title="Composition of the book" subtitle="Invoices by status">
            <m3k-donut-chart
              [slices]="statusSlices"
              centerLabel="Invoices"
              [centerValue]="invoiceCount"
              ariaLabel="Invoice count by status"
            />
            <m3k-chart-legend m3kChartCardLegend [items]="statusLegend" />
          </m3k-chart-card>
          <m3k-chart-card title="The monthly account" subtitle="Invoice counts by status">
            <m3k-bar-chart
              [categories]="monthlyStatus.categories"
              [series]="monthlyStatus.series"
              mode="stacked"
              ariaLabel="Monthly invoice counts stacked by status"
            />
            <m3k-chart-legend m3kChartCardLegend [items]="statusLegend" />
          </m3k-chart-card>

          <div class="dashboard__details">
            <m3k-detail-card
              title="Latest invoice"
              [subtitle]="latestInvoice.number"
              [rows]="latestInvoiceRows"
            />
            <m3k-detail-card
              title="Top customer"
              subtitle="By total billed"
              [rows]="topCustomerRows"
            />
          </div>
        </div>
      </div>
    </section>
  }

  <!-- Field Guide: the default composition with sentiment corner accents. -->
  @case ('pill-tabs') {
    <section class="dashboard">
      <m3k-page-header class="dashboard__header" title="Dashboard" />

      <m3k-dashboard-grid minColumnWidth="14rem" gap="1rem">
        <m3k-kpi-card
          label="Total revenue"
          [value]="totalRevenue"
          format="currency"
          [delta]="revenueDelta"
          [sparkline]="revenueByMonth"
          icon="payments"
          cornerAccent="positive"
        />
        <m3k-kpi-card
          label="Open invoices"
          [value]="openInvoiceCount"
          format="number"
          [delta]="openInvoicesDelta"
          icon="receipt_long"
          cornerAccent="neutral"
        />
        <m3k-kpi-card
          label="Overdue"
          [value]="overdueCount"
          format="number"
          [delta]="overdueDelta"
          icon="event_busy"
          cornerAccent="negative"
        />
        <m3k-kpi-card
          label="Open tickets"
          [value]="openTicketCount"
          format="number"
          [delta]="openTicketsDelta"
          icon="support_agent"
          cornerAccent="neutral"
        />
      </m3k-dashboard-grid>

      <div class="dashboard__chart-row">
        <m3k-chart-card title="Revenue by month" subtitle="Paid, trailing 12 months">
          <m3k-line-chart
            [series]="revenueSeries"
            [area]="true"
            ariaLabel="Paid revenue by month, trailing twelve months"
          />
        </m3k-chart-card>
        <m3k-chart-card title="Invoices by status" subtitle="All invoices">
          <m3k-donut-chart
            [slices]="statusSlices"
            centerLabel="Invoices"
            [centerValue]="invoiceCount"
            ariaLabel="Invoice count by status"
          />
          <m3k-chart-legend m3kChartCardLegend [items]="statusLegend" />
        </m3k-chart-card>
      </div>

      <m3k-chart-card
        class="dashboard__chart-wide"
        title="Monthly invoices by status"
        subtitle="Counts per issue month"
      >
        <m3k-bar-chart
          [categories]="monthlyStatus.categories"
          [series]="monthlyStatus.series"
          mode="stacked"
          ariaLabel="Monthly invoice counts stacked by status"
        />
        <m3k-chart-legend m3kChartCardLegend [items]="statusLegend" />
      </m3k-chart-card>

      <div class="dashboard__detail-grid">
        <m3k-detail-card
          title="Latest invoice"
          [subtitle]="latestInvoice.number"
          [rows]="latestInvoiceRows"
        />
        <m3k-detail-card title="Top customer" subtitle="By total billed" [rows]="topCustomerRows" />
      </div>
    </section>
  }

  <!-- Instruments (sidenav): KPI grid, two-up charts, full-width bars, details. -->
  @default {
    <section class="dashboard">
      <m3k-page-header class="dashboard__header" title="Dashboard" />

      <m3k-dashboard-grid minColumnWidth="14rem" gap="1rem">
        <m3k-kpi-card
          label="Total revenue"
          [value]="totalRevenue"
          format="currency"
          [delta]="revenueDelta"
          [sparkline]="revenueByMonth"
          icon="payments"
        />
        <m3k-kpi-card
          label="Open invoices"
          [value]="openInvoiceCount"
          format="number"
          [delta]="openInvoicesDelta"
          icon="receipt_long"
        />
        <m3k-kpi-card
          label="Overdue"
          [value]="overdueCount"
          format="number"
          [delta]="overdueDelta"
          icon="event_busy"
        />
        <m3k-kpi-card
          label="Open tickets"
          [value]="openTicketCount"
          format="number"
          [delta]="openTicketsDelta"
          icon="support_agent"
        />
      </m3k-dashboard-grid>

      <div class="dashboard__chart-row">
        <m3k-chart-card title="Revenue by month" subtitle="Paid, trailing 12 months">
          <m3k-line-chart
            [series]="revenueSeries"
            [area]="true"
            ariaLabel="Paid revenue by month, trailing twelve months"
          />
        </m3k-chart-card>
        <m3k-chart-card title="Invoices by status" subtitle="All invoices">
          <m3k-donut-chart
            [slices]="statusSlices"
            centerLabel="Invoices"
            [centerValue]="invoiceCount"
            ariaLabel="Invoice count by status"
          />
          <m3k-chart-legend m3kChartCardLegend [items]="statusLegend" />
        </m3k-chart-card>
      </div>

      <m3k-chart-card
        class="dashboard__chart-wide"
        title="Monthly invoices by status"
        subtitle="Counts per issue month"
      >
        <m3k-bar-chart
          [categories]="monthlyStatus.categories"
          [series]="monthlyStatus.series"
          mode="stacked"
          ariaLabel="Monthly invoice counts stacked by status"
        />
        <m3k-chart-legend m3kChartCardLegend [items]="statusLegend" />
      </m3k-chart-card>

      <div class="dashboard__detail-grid">
        <m3k-detail-card
          title="Latest invoice"
          [subtitle]="latestInvoice.number"
          [rows]="latestInvoiceRows"
        />
        <m3k-detail-card title="Top customer" subtitle="By total billed" [rows]="topCustomerRows" />
      </div>
    </section>
  }
}
