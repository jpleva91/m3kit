<section class="dashboard">
  <h1 class="dashboard__title">Dashboard</h1>

  <rpt-dashboard-grid minColumnWidth="14rem" gap="1rem">
    <rpt-kpi-card
      label="Total revenue"
      [value]="totalRevenue"
      format="currency"
      [delta]="revenueDelta"
      [sparkline]="revenueByMonth"
      icon="payments"
    />
    <rpt-kpi-card
      label="Open invoices"
      [value]="openInvoiceCount"
      format="number"
      [delta]="openInvoicesDelta"
      icon="receipt_long"
    />
    <rpt-kpi-card
      label="Overdue"
      [value]="overdueCount"
      format="number"
      [delta]="overdueDelta"
      icon="event_busy"
    />
    <rpt-kpi-card
      label="Open tickets"
      [value]="openTicketCount"
      format="number"
      [delta]="openTicketsDelta"
      icon="support_agent"
    />

    <rpt-detail-card
      [rptGridSpan]="2"
      title="Latest invoice"
      [subtitle]="latestInvoice.number"
      [rows]="latestInvoiceRows"
    />
    <rpt-detail-card
      [rptGridSpan]="2"
      title="Top customer"
      subtitle="By total billed"
      [rows]="topCustomerRows"
    />
  </rpt-dashboard-grid>
</section>
