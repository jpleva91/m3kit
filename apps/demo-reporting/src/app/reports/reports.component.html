<section class="report-page">
  <m3k-page-toolbar [title]="definition.title" [rowCount]="store.totalCount()" />

  <m3k-table-filter-bar [definition]="definition" (filterChange)="onFilterChange($event)" />

  <mat-accordion class="report-page__filters">
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>Field filters</mat-panel-title>
        <mat-panel-description>Filter by individual columns</mat-panel-description>
      </mat-expansion-panel-header>
      <m3k-filter-form
        [definition]="definition"
        [options]="filterOptions"
        (filtersChange)="onFiltersChange($event)"
      />
    </mat-expansion-panel>
  </mat-accordion>

  <m3k-data-table
    [definition]="definition"
    [rows]="store.rows()"
    [loading]="store.loading()"
    [error]="store.errorMessage()"
    [totalCount]="store.totalCount()"
    [sort]="store.sort()"
    [page]="store.page()"
    (sortChange)="store.setSort($event)"
    (pageChange)="store.setPage($event)"
    (rowClicked)="onRowClicked($event)"
  />

  @if (selectedInvoice(); as invoice) {
    <p class="selection-hint">
      Selected invoice: {{ invoice.number }} ({{ invoice.customerName }})
    </p>
  }
</section>
