<mat-toolbar color="primary">
  @if (isHandset()) {
    <button
      mat-icon-button
      type="button"
      class="nav-toggle"
      aria-label="Toggle navigation"
      (click)="sidenav.toggle()"
    >
      <mat-icon>menu</mat-icon>
    </button>
  }
  <span>{{ title }}</span>
  <span class="toolbar-spacer"></span>
  <button
    mat-icon-button
    type="button"
    class="brand-switcher"
    aria-label="Choose brand theme"
    [matMenuTriggerFor]="brandMenu"
  >
    <mat-icon>palette</mat-icon>
  </button>
  <mat-menu #brandMenu="matMenu">
    @for (brand of brands; track brand.value) {
      <button
        mat-menu-item
        type="button"
        role="menuitemradio"
        [attr.aria-checked]="themeService.brand() === brand.value"
        (click)="themeService.setBrand(brand.value)"
      >
        @if (themeService.brand() === brand.value) {
          <mat-icon>check</mat-icon>
        }
        <span>{{ brand.label }}</span>
      </button>
    }
  </mat-menu>
  <button
    mat-icon-button
    type="button"
    class="theme-toggle"
    [attr.aria-label]="
      themeService.mode() === 'dark'
        ? 'Switch to light mode'
        : 'Switch to dark mode'
    "
    (click)="themeService.toggleMode()"
  >
    <mat-icon>{{
      themeService.mode() === 'dark' ? 'light_mode' : 'dark_mode'
    }}</mat-icon>
  </button>
</mat-toolbar>

<mat-sidenav-container class="app-container">
  <mat-sidenav
    #sidenav
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <mat-nav-list (click)="isHandset() && sidenav.close()">
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a
        mat-list-item
        routerLink="/reports"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <mat-icon matListItemIcon>table_chart</mat-icon>
        <span matListItemTitle>Invoices</span>
      </a>
      <a mat-list-item routerLink="/reports/customers" routerLinkActive="active-link">
        <mat-icon matListItemIcon>group</mat-icon>
        <span matListItemTitle>Customers</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
