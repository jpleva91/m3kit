<!-- All chrome (presets, nav, handset behavior) lives in @m3kit/shell;
     the app projects its theme controls and its router-outlet. -->
<m3k-app-shell [preset]="layoutPreset()" [nav]="navLinks" [title]="title">
  <!-- Brand/dark controls stamped at every preset's controls position. -->
  <ng-template m3kShellToolbarActions>
    <button
      mat-icon-button
      type="button"
      class="brand-switcher"
      aria-label="Choose brand theme"
      [matMenuTriggerFor]="brandMenu"
    >
      <mat-icon>palette</mat-icon>
    </button>
    <mat-menu #brandMenu="matMenu">
      @for (brand of brands; track brand.value) {
        <button
          mat-menu-item
          type="button"
          role="menuitemradio"
          [attr.aria-checked]="themeService.brand() === brand.value"
          (click)="themeService.setBrand(brand.value)"
        >
          @if (themeService.brand() === brand.value) {
            <mat-icon>check</mat-icon>
          }
          <span>{{ brand.label }}</span>
        </button>
      }
    </mat-menu>
    <button
      mat-icon-button
      type="button"
      class="theme-toggle"
      [attr.aria-label]="
        themeService.mode() === 'dark'
          ? 'Switch to light mode'
          : 'Switch to dark mode'
      "
      (click)="themeService.toggleMode()"
    >
      <mat-icon>{{
        themeService.mode() === 'dark' ? 'light_mode' : 'dark_mode'
      }}</mat-icon>
    </button>
  </ng-template>

  <!-- The single routed view, stamped into whichever shell is active. -->
  <router-outlet />
</m3k-app-shell>
